<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Portfolio</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            animation: fadeIn 1s forwards;
            overflow-x: hidden;
        }
        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: #ff2a2a;
            text-decoration: none;
            padding: 10px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #2a6cff;
            text-shadow: 0 0 10px #2a6cff;
        }
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 100px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid #ff2a2a;
            transition: transform 0.5s;
        }
        .avatar:hover {
            transform: scale(1.1);
        }
        .stats {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="journey.html">Journey</a>
            <a href="skills.html">Skills</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <div class="profile-card">
        <img src="avatar.jpg" alt="Avatar" class="avatar">
        <h1>Backtestbd</h1>
        <h3>@backtestbd</h3>
        <p>AI Developer, Builder</p>
        <div class="stats">
            <span>Projects: 10</span>
            <span>Followers: 200</span>
            <span>Following: 50</span>
        </div>
    </div>
</body>
</html>
